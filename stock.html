
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Stock - BookHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header>
    <h1>📚 BookHub</h1>
    <p>Book Stock Management</p>
</header>

<div class="container">

    <h2 class="section-title">Stock Details</h2>

    <div class="card">

        <h3>Manage Book Stock</h3>

        <form id="stockForm">

            <label>Enter Available Stock:</label>
            <br><br>

            <input type="number" id="bookStock"
                   placeholder="Enter Stock Quantity"
                   min="0" step="1" required>

            <br><br>

            <button type="submit">Submit</button>

        </form>

        <p id="message"></p>

        <br>

        <a href="../index.html">Back to Home</a>

    </div>

</div>

<script>
    document.getElementById("stockForm").addEventListener("submit", function(event) {

        event.preventDefault();

        let stock = document.getElementById("bookStock").value;

        document.getElementById("message").innerText =
            "Available Stock entered successfully: " + stock;

    });
</script>

</body>
</html>
