
<!DOCTYPE html>
<html>
<head>
    <title>Delete Book - BookHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header>
        <h1>Delete Book</h1>
        <p>Remove a book from the library</p>
    </header>

    <main class="container">
        <section class="card">
            <h2>Delete Book Details</h2>

            <form id="deleteForm">
                <label>Enter Book ID:</label>
                <input type="text" id="bookId" placeholder="Enter Book ID" required>

                <button type="submit">Delete Book</button>
            </form>

            <p id="message"></p>

            <a href="../index.html">Back to Home</a>
        </section>
    </main>

    <script>
        document.getElementById("deleteForm").addEventListener("submit", function(event) {
            event.preventDefault();

            let id = document.getElementById("bookId").value;
            let books = JSON.parse(localStorage.getItem("books")) || [];

            let index = books.findIndex(book => book.id === id);

            if (index === -1) {
                document.getElementById("message").innerText = "Book ID not found!";
            } else {
                books.splice(index, 1);
                localStorage.setItem("books", JSON.stringify(books));

                document.getElementById("message").innerText =
                    "Book deleted successfully!";
                document.getElementById("deleteForm").reset();
            }
        });
    </script>

</body>
</html>
