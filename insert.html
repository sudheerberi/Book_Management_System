
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insert Book - BookHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header>
    <h1>📚 BookHub</h1>
    <p>Insert New Book</p>
</header>

<div class="container">

    <h2 class="section-title">Add Book Details</h2>

    <div class="card">

        <form id="bookForm">

            <label>Book ID:</label><br><br>
            <input type="text" id="bookId" placeholder="Enter Book ID" required>
            <br><br>

            <label>Book Title:</label><br><br>
            <input type="text" id="title" placeholder="Enter Book Title" required>
            <br><br>

            <label>Author:</label><br><br>
            <input type="text" id="author" placeholder="Enter Author Name" required>
            <br><br>

            <label>Category:</label><br><br>
            <select id="category" required>
                <option value="">Select Category</option>
                <option>Programming</option>
                <option>Science</option>
                <option>Technology</option>
                <option>Fiction</option>
                <option>History</option>
                <option>Education</option>
            </select>
            <br><br>

            <label>Price (₹):</label><br><br>
            <input type="number" id="price" placeholder="Enter Price" min="0.01" step="0.01" required>
            <br><br>

            <label>Stock:</label><br><br>
            <input type="number" id="stock" placeholder="Enter Stock" min="0" step="1" required>
            <br><br>

            <button type="submit">Insert Book</button>

        </form>

        <p id="message"></p>

        <br>
        <a href="../index.html">Back to Home</a>

    </div>

</div>

<script>
document.getElementById("bookForm").addEventListener("submit", function(event) {

    event.preventDefault();

    let book = {
        id: document.getElementById("bookId").value.trim(),
        title: document.getElementById("title").value.trim(),
        author: document.getElementById("author").value.trim(),
        category: document.getElementById("category").value,
        price: Number(document.getElementById("price").value),
        stock: Number(document.getElementById("stock").value)
    };

    let books = JSON.parse(localStorage.getItem("books")) || [];

    let exists = books.some(item => item.id === book.id);

    if (exists) {
        document.getElementById("message").innerText =
            "Book ID already exists!";
        return;
    }

    books.push(book);

    localStorage.setItem("books", JSON.stringify(books));

    document.getElementById("message").innerText =
        "Book inserted successfully!";

    document.getElementById("bookForm").reset();

});
</script>

</body>
</html>
