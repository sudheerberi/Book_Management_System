
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Author - BookHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header>
    <h1>📚 BookHub</h1>
    <p>Book Author Management</p>
</header>

<div class="container">

    <h2 class="section-title">Author Details</h2>

    <div class="card">

        <h3>Manage Book Author</h3>

        <form id="authorForm">

            <label>Enter Author Name:</label>
            <br><br>

            <input type="text" id="authorName"
                   placeholder="Enter Author Name" required>

            <br><br>

            <button type="submit">Submit</button>

        </form>

        <p id="message"></p>

        <br>

        <a href="../index.html">Back to Home</a>

    </div>

</div>

<script>
    document.getElementById("authorForm").addEventListener("submit", function(event) {

        event.preventDefault();

        let author = document.getElementById("authorName").value;

        document.getElementById("message").innerText =
            "Author entered successfully: " + author;

    });
</script>

</body>
</html>
